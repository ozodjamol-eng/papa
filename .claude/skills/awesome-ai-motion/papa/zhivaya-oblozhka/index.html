<!doctype html>
<html><head><meta charset="utf-8"><title>KD taxi cover anim</title>
<link rel="stylesheet" href="../../lib/stage.css">
<style>
@font-face{font-family:"OswaldV";src:url("fonts/Oswald.ttf");font-weight:200 700;font-display:block}
@font-face{font-family:"MontV";src:url("fonts/Montserrat.ttf");font-weight:100 900;font-display:block}
html,body{background:#000}
.frame{background:#000!important;background-image:none!important}
.scene{left:0!important;right:0!important;top:0!important;bottom:0!important;overflow:hidden}
.cam{position:absolute;inset:0;transform-origin:400px 380px}
.cam img{position:absolute;left:0;top:0;width:1080px;height:1440px}
.clipwin{position:absolute;left:0;right:0;top:0;height:455px;overflow:hidden}
.behind{position:absolute;left:0;right:0;top:130px;text-align:center;font-family:"OswaldV";font-weight:700;font-size:330px;line-height:1;color:#fff;letter-spacing:.01em;text-shadow:0 0 40px rgba(255,220,80,.25)}
.badge{position:absolute;top:42px;height:72px;border:2px solid rgba(255,255,255,.35);border-radius:16px;background:rgba(0,0,0,.55);font-family:"MontV";font-weight:800;font-size:28px;display:flex;align-items:center;padding:0 24px;letter-spacing:.01em}
.b1{left:42px;color:#fff}.b2{right:42px;color:#F9E006}
.chip{position:absolute;left:62px;top:782px;height:60px;background:#F9E006;border-radius:6px;color:#000;font-family:"MontV";font-weight:900;font-size:38px;display:flex;align-items:center;padding:0 16px;clip-path:inset(0 100% 0 0)}
.win{position:absolute;left:50px;overflow:hidden}
.h{display:block;font-family:"OswaldV";font-weight:700;font-size:228px;line-height:204px;letter-spacing:-.005em}
.w1{top:860px;height:208px}.w2{top:1062px;height:208px}
.w1 .h{color:#fff}.w2 .h{color:#F9E006}
.foot{position:absolute;bottom:52px;font-family:"MontV";font-weight:800;font-size:34px;color:#fff}
.f1{left:56px}.f2{right:56px;display:flex;align-items:center;gap:18px}
.shade{position:absolute;left:0;right:0;bottom:0;height:760px;background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0))}
</style></head>
<body data-dur="6" data-size="1080x1440" data-poster="5.6"><main class="scene">
<div class="cam" id="cam">
  <img src="bg.png">
  <div class="clipwin"><div class="behind" id="behind">ТАКСИ</div></div>
  <img src="sign.png">
</div>
<div class="shade"></div>
<div class="badge b1">КАТТА ДАВРА</div><div class="badge b2">#ТРЕНД</div>
<div class="chip">ТАКСИ БОЗОРИ</div>
<div class="win w1"><span class="h">КИМ</span></div>
<div class="win w2"><span class="h">КИМНИКИ?</span></div>
<div class="foot f1">@kattadavrauz</div>
<div class="foot f2">ДАВОМИ КАНАЛДА <svg width="40" height="28" viewBox="0 0 40 28"><path d="M2 14H36M24 3l12 11-12 11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</main>
<script src="../../lib/gsap.min.js"></script>
<script src="../../lib/stage.js"></script>
<script>
const tl = Motion.timeline();
tl.fromTo('#cam',{scale:1.0},{scale:1.07,duration:6,ease:'none'},0);
tl.fromTo('#behind',{y:340,opacity:1},{y:0,duration:1.25,ease:'power3.out'},.25);
tl.fromTo('.badge',{y:-30,opacity:0},{y:0,opacity:1,duration:.6,stagger:.12},1.0);
tl.to('.chip',{clipPath:'inset(0 0% 0 0)',duration:.55,ease:'power2.inOut'},1.45);
tl.fromTo('.h',{yPercent:110},{yPercent:0,duration:.9,stagger:.28,ease:'power3.out'},1.75);
tl.fromTo('.foot',{opacity:0,y:20},{opacity:1,y:0,duration:.6,stagger:.1},2.7);
tl.fromTo('.f2 svg',{x:0},{x:10,duration:.5,yoyo:true,repeat:3,ease:'sine.inOut'},3.3);
Motion.ready();
</script></body></html>
