<!doctype html>
<html><head><meta charset="utf-8"><title>Mustafo premyera</title>
<link rel="stylesheet" href="../../lib/stage.css">
<style>
@font-face{font-family:"OswaldV";src:url("fonts/Oswald.ttf");font-weight:200 700;font-display:block}
@font-face{font-family:"MontV";src:url("fonts/Montserrat.ttf");font-weight:100 900;font-display:block}
html,body{background:#000}
.frame{background:#000!important;background-image:none!important}
.scene{left:0!important;right:0!important;top:0!important;bottom:0!important;overflow:hidden;background:radial-gradient(ellipse at 50% 85%,#1c1508 0%,#000 60%)}
.gold{background:linear-gradient(180deg,#FFF1B8 0%,#F2C94C 40%,#B8862B 75%,#F5D778 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#cam{position:absolute;left:0;top:0;width:1080px;height:1337px;transform-origin:540px 520px;opacity:0}
#cam img{position:absolute;left:0;top:0;width:1080px;height:1337px}
.fade{position:absolute;left:0;top:0;width:1080px;height:1337px;background:linear-gradient(to bottom,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 55%,rgba(0,0,0,.85) 85%,#000 100%)}
.behind{position:absolute;left:0;right:0;top:150px;text-align:center;font-family:"OswaldV";font-weight:700;font-size:280px;line-height:1;letter-spacing:0;filter:drop-shadow(0 0 30px rgba(242,201,76,.25))}
.bwin{position:absolute;left:0;right:0;top:0;height:560px;overflow:hidden}
.intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.intro .t{font-family:"MontV";font-weight:900;font-size:120px;letter-spacing:.1em;padding-left:.1em}
.intro .ln{width:0;height:4px;margin-top:26px;background:linear-gradient(90deg,transparent,#F2C94C,transparent)}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,226,140,.55),rgba(0,0,0,0) 60%);opacity:0}
.badge{position:absolute;top:56px;right:48px;height:64px;padding:0 22px;border:2px solid #F2C94C;border-radius:32px;display:flex;align-items:center;font-family:"MontV";font-weight:900;font-size:28px;letter-spacing:.14em;color:#F2C94C;background:rgba(0,0,0,.45);opacity:0}
.win{position:absolute;left:0;right:0;overflow:hidden;text-align:center}
.vallah{top:905px;height:200px}.vallah span{display:block;font-family:"OswaldV";font-weight:700;font-size:190px;line-height:200px;color:#fff;letter-spacing:.04em}
.artist{position:absolute;left:0;right:0;top:1120px;text-align:center;font-family:"MontV";font-weight:900;font-size:50px;letter-spacing:.42em;padding-left:.42em;color:#F2C94C}
.date{top:1230px;height:230px}.date span{display:block;font-family:"OswaldV";font-weight:700;font-size:220px;line-height:230px;color:#fff}
.timebox{position:absolute;left:0;right:0;top:1475px;display:flex;justify-content:center;align-items:center;gap:22px;font-family:"MontV";font-weight:900;color:#fff}
.timebox .lab{font-size:54px;letter-spacing:.12em;color:#F2C94C}
.drum{display:flex;font-family:"OswaldV";font-weight:700;font-size:110px;line-height:120px}
.d{height:120px;overflow:hidden;width:58px;text-align:center}.d .col{display:flex;flex-direction:column}
.colon{width:28px;text-align:center}
.yt{position:absolute;left:0;right:0;top:1655px;display:flex;justify-content:center;align-items:center;gap:20px;font-family:"MontV";font-weight:800;font-size:48px;color:#fff;opacity:0}
.foot{position:absolute;left:0;right:0;top:1795px;text-align:center;font-family:"MontV";font-weight:800;font-size:34px;letter-spacing:.08em;color:rgba(255,255,255,.85);opacity:0}
</style></head>
<body data-dur="15" data-size="1080x1920" data-poster="14.5"><main class="scene">
<div id="cam">
  <img src="photo.png" style="filter:brightness(.5) saturate(.85)">
  <div class="bwin"><div class="behind gold" id="behind">ÖLÜRÜM</div></div>
  <img src="person.png">
  <div class="fade"></div>
</div>
<div class="flash" id="flash"></div>
<div class="intro" id="intro"><div class="t gold" id="pt">ПРЕМЬЕРА</div><div class="ln" id="ln"></div></div>
<div class="badge" id="badge">ПРЕМЬЕРА</div>
<div class="win vallah"><span>VALLAH</span></div>
<div class="artist" id="artist">МУСТАФО</div>
<div class="win date"><span>11-НОЯБР</span></div>
<div class="timebox" id="tb"><span class="lab">СОАТ</span><div class="drum">
 <div class="d"><div class="col"><span>0</span><span>1</span><span>2</span></div></div>
 <div class="d"><div class="col"><span>0</span><span>5</span><span>0</span></div></div>
 <div class="colon">:</div>
 <div class="d"><div class="col"><span>0</span></div></div>
 <div class="d"><div class="col"><span>0</span></div></div></div></div>
<div class="yt" id="yt"><svg width="78" height="56" viewBox="0 0 78 56"><rect width="78" height="56" rx="14" fill="#FF0000"/><path d="M31 16 L54 28 L31 40Z" fill="#fff"/></svg><span>NevoMusic</span><span style="color:#F2C94C">·</span><span>YouTube</span></div>
<div class="foot" id="foot">PAPARAZZI UZ · @ozodjamoll</div>
</main>
<script src="../../lib/gsap.min.js"></script>
<script src="../../lib/stage.js"></script>
<script>
const tl = Motion.timeline();
// 1. intro 0-2
tl.fromTo('#pt',{letterSpacing:'.5em',opacity:0,scale:1.08},{letterSpacing:'.1em',opacity:1,scale:1,duration:1.1,ease:'power3.out'},.15);
tl.to('#ln',{width:620,duration:.8,ease:'power2.inOut'},.6);
tl.to('#flash',{opacity:1,duration:.12,ease:'none'},1.75).to('#flash',{opacity:0,duration:.6,ease:'power2.out'},1.87);
tl.to('#intro',{opacity:0,scale:.96,duration:.35,ease:'power2.in'},1.7);
// 2. photo 2-6
tl.to('#cam',{opacity:1,duration:.5,ease:'none'},1.8);
tl.fromTo('#cam',{scale:1.12},{scale:1.0,duration:13.2,ease:'power1.out'},1.8);
tl.fromTo('#behind',{y:420},{y:0,duration:1.3,ease:'power3.out'},2.3);
tl.fromTo('.vallah span',{yPercent:110},{yPercent:0,duration:.9,ease:'power3.out'},3.0);
tl.fromTo('#artist',{opacity:0,letterSpacing:'.8em'},{opacity:1,letterSpacing:'.42em',duration:1.0,ease:'power3.out'},3.8);
tl.fromTo('#badge',{opacity:0,y:-20},{opacity:1,y:0,duration:.5},4.4);
// 3. date 6-10
tl.fromTo('.date span',{yPercent:110},{yPercent:0,duration:.9,ease:'power3.out'},6.0);
tl.fromTo('#tb',{opacity:0,y:30},{opacity:1,y:0,duration:.6},6.6);
const cols=document.querySelectorAll('.d .col');
tl.fromTo(cols[0],{y:0},{y:-240,duration:1.4,ease:'power2.inOut'},6.9);
tl.fromTo(cols[1],{y:0},{y:-240,duration:1.6,ease:'power2.inOut'},6.9);
// 4. platform 10-13
tl.fromTo('#yt',{opacity:0,y:30},{opacity:1,y:0,duration:.6},10.0);
tl.fromTo('#yt svg',{scale:.6},{scale:1,duration:.6,ease:'back.out(2)'},10.0);
// 5. channel 13-15
tl.fromTo('#foot',{opacity:0},{opacity:1,duration:.6},12.8);
Motion.ready();
</script></body></html>
