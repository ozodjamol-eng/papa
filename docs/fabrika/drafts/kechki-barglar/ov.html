<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
body{font-family:Inter,"Inter Display",sans-serif;color:#fff}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse 90% 60% at 50% 50%,rgba(10,8,20,.42),rgba(10,8,20,.2) 70%,rgba(0,0,0,.35))}
.blk{position:absolute;left:70px;right:70px;top:50%;transform:translateY(-50%);text-align:center;opacity:0}
.k{font-size:34px;font-weight:800;letter-spacing:10px;color:#ffd39a;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.big{font-family:"Inter Display",Inter;font-weight:900;font-size:130px;letter-spacing:-2px;line-height:1;text-shadow:0 8px 50px rgba(0,0,0,.55)}
.mid{font-size:40px;font-weight:600;color:rgba(255,255,255,.9);margin-top:24px;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.glass{border-radius:48px;background:rgba(20,14,30,.42);border:1.5px solid rgba(255,255,255,.2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 30px 90px rgba(0,0,0,.4);padding:56px 54px}
.cols{display:flex;justify-content:space-between;margin-top:40px}
.col{width:270px}
.col small{display:block;font-size:34px;color:rgba(255,255,255,.75);font-weight:600}
.col svg{margin:20px auto 8px;display:block}
.col b{display:block;font-size:84px;font-weight:800;letter-spacing:-1px}
.line{margin-top:36px;padding-top:30px;border-top:1px solid rgba(255,255,255,.18);font-size:34px;color:rgba(255,255,255,.88);display:flex;justify-content:space-between}
.tip{margin-top:26px;font-size:36px;font-weight:700;background:rgba(255,190,110,.18);border-radius:24px;padding:22px 26px}
.rt{display:flex;flex-direction:column;gap:26px;margin-top:40px}
.rt div{display:flex;justify-content:space-between;align-items:center;border-radius:30px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16);padding:30px 44px}
.rt small{font-size:36px;letter-spacing:4px;color:rgba(255,255,255,.75);font-weight:700}.rt b{font-size:64px;font-weight:800}
.bd{display:inline-block;margin-top:34px;font-size:40px;font-weight:800;color:#2a1606;background:#ffd39a;border-radius:999px;padding:16px 40px}
</style></head><body>
<div class="shade"></div>
<div class="blk" id="b0"><div class="k" id="date"></div><div class="big" style="margin-top:30px">КЕЧКИ<br>ДАЙЖЕСТ</div></div>
<div class="blk" id="b1"><svg width="360" height="190" viewBox="0 0 360 190" style="display:block;margin:0 auto 30px"><defs><radialGradient id="sg"><stop offset="0" stop-color="#fff3d0"/><stop offset=".6" stop-color="#ffb35c"/><stop offset="1" stop-color="#ff8a3c" stop-opacity="0"/></radialGradient><clipPath id="cp"><rect x="0" y="0" width="360" height="150"/></clipPath></defs><g clip-path="url(#cp)"><circle id="ssun" cx="180" cy="90" r="70" fill="url(#sg)"/></g><line x1="20" y1="150" x2="340" y2="150" stroke="rgba(255,255,255,.75)" stroke-width="4" stroke-linecap="round"/></svg>
 <div class="k">БУГУН ҚУЁШ БОТИШИ</div><div class="big" id="ss" style="margin-top:20px"></div></div>
<div class="blk glass" id="b2"><div class="k">ЭРТАГА ОБ-ҲАВО</div>
 <div class="cols"><div class="col"><small>Тонг</small><svg id="i0" width="120" height="96" viewBox="0 0 110 90"></svg><b id="w0"></b></div>
  <div class="col"><small>Кун</small><svg id="i1" width="120" height="96" viewBox="0 0 110 90"></svg><b id="w1"></b></div>
  <div class="col"><small>Кеч</small><svg id="i2" width="120" height="96" viewBox="0 0 110 90"></svg><b id="w2"></b></div></div>
 <div class="line"><span id="rain"></span><span id="wind"></span></div><div class="tip" id="tip"></div></div>
<div class="blk" id="b3"><svg width="420" height="230" viewBox="0 0 420 230" style="display:block;margin:0 auto 30px"><path d="M40 200 A170 170 0 0 1 380 200" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="4" stroke-dasharray="8 12"/><line x1="10" y1="200" x2="410" y2="200" stroke="rgba(255,255,255,.75)" stroke-width="4" stroke-linecap="round"/><circle id="rsun" cx="40" cy="200" r="26" fill="#ffc46b"/></svg>
 <div class="k">ЭРТАГА ҚУЁШ ЧИҚИШИ</div><div class="big" id="sr" style="margin-top:20px"></div><div class="mid" id="dl"></div><div class="bd" id="bdm"></div></div>
<div class="blk glass" id="b4"><div class="k">ВАЛЮТА КУРСИ</div><div class="rt"><div><small>USD</small><b id="r0"></b></div><div><small>EUR</small><b id="r1"></b></div><div><small>RUB</small><b id="r2"></b></div></div></div>
<div class="blk" id="b5"><div class="big" id="u" style="font-size:96px"></div><div class="k" id="ch" style="margin-top:26px;color:rgba(255,255,255,.85)"></div></div>
<script>
const D=window.DATA||{date:"27.10 · СЕШАНБА",sunset:"17:25",sunrise:"06:48",daylen:"Кун узунлиги 10 соат 37 дақиқа",bomdod:"Бомдод — 05:20",
 w:[{t:6,k:"cloud"},{t:18,k:"sun"},{t:11,k:"partly"}],rain:"💧 Ёмғир 10%",wind:"🌬 Шамол 3 м/с",tip:"🧥 Эрталаб салқин — иссиқроқ кийининг",
 rates:[12650,13780,156],user:"@xojaobodcity24",ch:"ХЎЖАОБОД СИТИ 24"};
const $=i=>document.getElementById(i);
$("date").textContent=D.date;$("ss").textContent=D.sunset;$("sr").textContent=D.sunrise;$("dl").textContent=D.daylen;
if(D.bomdod)$("bdm").textContent=D.bomdod;else $("bdm").style.display="none";
$("rain").textContent=D.rain;$("wind").textContent=D.wind;$("tip").textContent=D.tip;$("u").textContent=D.user;$("ch").textContent=D.ch;
const ICON={sun:`<circle cx="55" cy="45" r="20" fill="#ffc46b"/><g stroke="#ffc46b" stroke-width="5" stroke-linecap="round" class="ry">${[...Array(8)].map((_,i)=>{const a=i*Math.PI/4;return `<line x1="${55+Math.cos(a)*29}" y1="${45+Math.sin(a)*29}" x2="${55+Math.cos(a)*38}" y2="${45+Math.sin(a)*38}"/>`}).join("")}</g>`,
 cloud:`<g class="cl"><path d="M28 70h52a17 17 0 0 0 1-34 24 24 0 0 0-45-4 19 19 0 0 0-8 38z" fill="#eef1f6"/></g>`,
 partly:`<circle cx="40" cy="34" r="17" fill="#ffc46b"/><g class="cl"><path d="M34 74h48a15 15 0 0 0 1-30 21 21 0 0 0-40-3 16 16 0 0 0-9 33z" fill="#eef1f6"/></g>`,
 rain:`<g class="cl"><path d="M28 56h52a17 17 0 0 0 1-34 24 24 0 0 0-45-4 19 19 0 0 0-8 38z" fill="#d3dae6"/></g><g class="dr" stroke="#8fc3ff" stroke-width="5" stroke-linecap="round"><line x1="40" y1="66" x2="36" y2="78"/><line x1="58" y1="66" x2="54" y2="78"/><line x1="76" y1="66" x2="72" y2="78"/></g>`};
D.w.forEach((w,i)=>$("i"+i).innerHTML=ICON[w.k]);
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),p=(t,a,b)=>cl((t-a)/(b-a)),eo=t=>1-Math.pow(1-t,3),ei=t=>t*t*t;
const fmt=n=>Math.round(n).toLocaleString("ru-RU").replace(/ /g," ");
const SEG=[[0.2,2.6],[2.8,5.2],[5.4,9.0],[9.2,11.8],[12.0,14.1],[14.3,16.5]];
window.DUR=16;
window.render=function(t){
 SEG.forEach(([a,b],i)=>{const e=$("b"+i),ki=eo(p(t,a,a+.6)),ko=ei(p(t,b-.45,b));
  const op=ki*(1-ko),y=(1-ki)*70-ko*60,bl=(1-ki)*14+ko*14,sc=.96+.04*ki+.03*ko;
  Object.assign(e.style,{opacity:op,transform:`translateY(calc(-50% + ${y}px)) scale(${sc})`,filter:bl>.3?`blur(${bl}px)`:"none"})});
 // закат: солнце уходит за линию
 $("ssun").setAttribute("cy",90+eo(p(t,3.1,5.0))*130);
 // погода: цифры и иконки
 D.w.forEach((w,i)=>{$("w"+i).textContent=(w.t>0?"+":"")+Math.round(w.t*eo(p(t,5.7+i*.2,6.9+i*.2)))+"°";
  const s=$("i"+i),c=s.querySelector(".cl"),r=s.querySelector(".ry"),d=s.querySelector(".dr");
  if(c)c.setAttribute("transform",`translate(${Math.sin(t*1.3+i)*5},0)`);if(r)r.setAttribute("transform",`rotate(${t*25} 55 45)`);if(d)d.setAttribute("transform",`translate(0,${(t*30)%10})`)});
 $("tip").style.opacity=eo(p(t,7,7.7));
 // восход: солнце идёт по дуге
 const a=Math.PI*(1-eo(p(t,9.5,11.3)));$("rsun").setAttribute("cx",210+Math.cos(a)*170);$("rsun").setAttribute("cy",200-Math.sin(a)*170);
 // курс
 D.rates.forEach((v,i)=>$("r"+i).textContent=fmt(v*eo(p(t,12.2+i*.15,13.3+i*.15))));
};
</script></body></html>
