<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
body{font-family:Inter,"Inter Display",sans-serif;color:#fff}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse 80% 45% at 50% 50%,rgba(0,0,0,.22),rgba(0,0,0,0) 75%)}
.blk{position:absolute;left:40px;right:40px;top:50%;text-align:center;opacity:0}
.k{font-size:40px;font-weight:800;letter-spacing:10px;color:#ffe0b0;text-shadow:0 2px 6px rgba(0,0,0,.7),0 0 30px rgba(0,0,0,.6)}
.big{font-family:"Inter Display",Inter;font-weight:900;font-size:200px;letter-spacing:-4px;line-height:1;text-shadow:0 4px 10px rgba(0,0,0,.55),0 10px 60px rgba(0,0,0,.6)}
.ttl{font-size:150px}
.mid{font-size:44px;font-weight:700;margin-top:26px;text-shadow:0 2px 6px rgba(0,0,0,.75),0 0 26px rgba(0,0,0,.6)}
.ico{display:block;margin:0 auto 20px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
.pill{display:inline-block;margin-top:34px;font-size:46px;font-weight:800;color:#2a1606;background:#ffd39a;border-radius:999px;padding:18px 48px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.cur{width:400px;height:400px;margin:0 auto 30px;border-radius:50%;border:8px solid rgba(255,224,176,.9);display:flex;align-items:center;justify-content:center;font-family:"Inter Display",Inter;font-weight:900;font-size:250px;color:#ffe0b0;text-shadow:0 8px 40px rgba(0,0,0,.5);box-shadow:0 0 0 2px rgba(0,0,0,.15),0 20px 60px rgba(0,0,0,.35),inset 0 0 40px rgba(0,0,0,.15)}
</style></head><body>
<div class="shade"></div>
<div class="blk" id="b0"><div class="k" id="date"></div><div class="big ttl" style="margin-top:34px">КЕЧКИ<br>ДАЙЖЕСТ</div></div>
<div class="blk" id="b1"><svg class="ico" width="520" height="300" viewBox="0 0 360 210"><defs><radialGradient id="sg"><stop offset="0" stop-color="#fff6dc"/><stop offset=".55" stop-color="#ffb35c"/><stop offset="1" stop-color="#ff8a3c" stop-opacity="0"/></radialGradient><clipPath id="cp"><rect x="0" y="0" width="360" height="170"/></clipPath></defs><g clip-path="url(#cp)"><circle id="ssun" cx="180" cy="95" r="80" fill="url(#sg)"/></g><line x1="20" y1="170" x2="340" y2="170" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>
 <div class="k">БУГУН ҚУЁШ БОТИШИ</div><div class="big" id="ss" style="margin-top:20px"></div></div>
<div class="blk" id="b2"><svg class="ico" id="i0" width="440" height="360" viewBox="0 0 110 90"></svg><div class="k">ЭРТАГА · ТОНГ</div><div class="big" id="w0" style="margin-top:16px"></div></div>
<div class="blk" id="b3"><svg class="ico" id="i1" width="440" height="360" viewBox="0 0 110 90"></svg><div class="k">ЭРТАГА · КУН</div><div class="big" id="w1" style="margin-top:16px"></div></div>
<div class="blk" id="b4"><svg class="ico" id="i2" width="440" height="360" viewBox="0 0 110 90"></svg><div class="k">ЭРТАГА · КЕЧ</div><div class="big" id="w2" style="margin-top:16px"></div><div class="mid" id="rw"></div><div class="mid" id="tip" style="font-size:40px;margin-top:14px"></div></div>
<div class="blk" id="b5"><svg class="ico" width="560" height="300" viewBox="0 0 420 225"><path d="M40 200 A170 170 0 0 1 380 200" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="5" stroke-dasharray="10 14"/><line x1="10" y1="200" x2="410" y2="200" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle id="rsun" cx="40" cy="200" r="34" fill="#ffc46b"/></svg>
 <div class="k">ЭРТАГА ҚУЁШ ЧИҚИШИ</div><div class="big" id="sr" style="margin-top:20px"></div><div class="mid" id="dl"></div><div class="pill" id="bdm"></div></div>
<div class="blk" id="b6"><div class="cur">$</div><div class="k">АҚШ ДОЛЛАРИ</div><div class="big" id="r0" style="margin-top:16px;font-size:170px"></div></div>
<div class="blk" id="b7"><div class="cur">€</div><div class="k">ЕВРО</div><div class="big" id="r1" style="margin-top:16px;font-size:170px"></div></div>
<div class="blk" id="b8"><div class="cur">₽</div><div class="k">РОССИЯ РУБЛИ</div><div class="big" id="r2" style="margin-top:16px;font-size:170px"></div></div>
<div class="blk" id="b9"><div class="big" id="u" style="font-size:100px;letter-spacing:-1px"></div><div class="k" id="ch" style="margin-top:28px"></div></div>
<script>
const D=window.DATA||{date:"27.10 · СЕШАНБА",sunset:"17:25",sunrise:"06:48",daylen:"Кун узунлиги 10 соат 37 дақиқа",bomdod:"Бомдод — 05:20",
 w:[{t:6,k:"cloud"},{t:18,k:"sun"},{t:11,k:"partly"}],rw:"💧 Ёмғир 10%  ·  🌬 Шамол 3 м/с",tip:"🧥 Эрталаб салқин — иссиқроқ кийининг",
 rates:[12650,13780,156],user:"@xojaobodcity24",ch:"ХЎЖАОБОД СИТИ 24"};
const $=i=>document.getElementById(i);
$("date").textContent=D.date;$("ss").textContent=D.sunset;$("sr").textContent=D.sunrise;$("dl").textContent=D.daylen;
if(D.bomdod)$("bdm").textContent=D.bomdod;else $("bdm").style.display="none";
$("rw").textContent=D.rw;$("tip").textContent=D.tip;$("u").textContent=D.user;$("ch").textContent=D.ch;
const ICON={sun:`<circle cx="55" cy="45" r="20" fill="#ffc46b"/><g stroke="#ffc46b" stroke-width="5" stroke-linecap="round" class="ry">${[...Array(8)].map((_,i)=>{const a=i*Math.PI/4;return `<line x1="${55+Math.cos(a)*29}" y1="${45+Math.sin(a)*29}" x2="${55+Math.cos(a)*38}" y2="${45+Math.sin(a)*38}"/>`}).join("")}</g>`,
 cloud:`<g class="cl"><path d="M28 70h52a17 17 0 0 0 1-34 24 24 0 0 0-45-4 19 19 0 0 0-8 38z" fill="#f4f6fa"/></g>`,
 partly:`<circle cx="40" cy="34" r="17" fill="#ffc46b"/><g class="cl"><path d="M34 74h48a15 15 0 0 0 1-30 21 21 0 0 0-40-3 16 16 0 0 0-9 33z" fill="#f4f6fa"/></g>`,
 rain:`<g class="cl"><path d="M28 56h52a17 17 0 0 0 1-34 24 24 0 0 0-45-4 19 19 0 0 0-8 38z" fill="#dfe5ee"/></g><g class="dr" stroke="#8fc3ff" stroke-width="5" stroke-linecap="round"><line x1="40" y1="66" x2="36" y2="78"/><line x1="58" y1="66" x2="54" y2="78"/><line x1="76" y1="66" x2="72" y2="78"/></g>`};
D.w.forEach((w,i)=>$("i"+i).innerHTML=ICON[w.k]);
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),p=(t,a,b)=>cl((t-a)/(b-a)),eo=t=>1-Math.pow(1-t,3),ei=t=>t*t*t;
const back=t=>{const s=1.5;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const fmt=n=>Math.round(n).toLocaleString("ru-RU").replace(/ /g," ");
const SEG=[[0.2,2.5],[2.6,4.9],[5.0,6.9],[7.0,8.9],[9.0,11.0],[11.1,13.3],[13.4,14.95],[15.0,16.55],[16.6,18.2],[18.3,20.6]];
window.DUR=20;
window.render=function(t){
 SEG.forEach(([a,b],i)=>{const e=$("b"+i),ki=p(t,a,a+.55),ko=ei(p(t,b-.4,b));
  const op=eo(ki)*(1-ko),y=(1-eo(ki))*80-ko*70,bl=(1-ki)*16+ko*16,sc=(.85+.15*back(ki))*(1+.05*ko);
  Object.assign(e.style,{opacity:op,transform:`translateY(calc(-50% + ${y}px)) scale(${sc})`,filter:bl>.3?`blur(${bl}px)`:"none"})});
 $("ssun").setAttribute("cy",95+eo(p(t,2.9,4.6))*170);
 D.w.forEach((w,i)=>{const a=SEG[2+i][0];$("w"+i).textContent=(w.t>0?"+":"")+Math.round(w.t*eo(p(t,a+.2,a+1.1)))+"°";
  const s=$("i"+i),c=s.querySelector(".cl"),r=s.querySelector(".ry"),d=s.querySelector(".dr");
  if(c)c.setAttribute("transform",`translate(${Math.sin(t*1.4+i)*4},0)`);if(r)r.setAttribute("transform",`rotate(${t*30} 55 45)`);if(d)d.setAttribute("transform",`translate(0,${(t*30)%10})`)});
 $("rw").style.opacity=eo(p(t,9.5,10));$("tip").style.opacity=eo(p(t,9.8,10.3));
 const a=Math.PI*(1-eo(p(t,11.3,12.8)));$("rsun").setAttribute("cx",210+Math.cos(a)*170);$("rsun").setAttribute("cy",200-Math.sin(a)*170);
 D.rates.forEach((v,i)=>{const a=SEG[6+i][0];$("r"+i).textContent=fmt(v*eo(p(t,a+.15,a+1.0)))});
};
</script></body></html>
