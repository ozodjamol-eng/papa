<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:PF;src:url(../assets/Playfair.ttf);font-weight:400 900}
@font-face{font-family:MR;src:url(../assets/Manrope.ttf);font-weight:200 800}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px}
.av{width:1080px;height:1080px;background:radial-gradient(ellipse at 50% 42%,#7A0B0B 0%,#5A0606 55%,#3A0303 100%);display:flex;align-items:center;justify-content:center}
.ring{width:1080px;height:1080px;border-radius:50%;box-shadow:inset 0 0 0 16px #C9A227,inset 0 0 0 26px #5A0606,inset 0 0 0 31px #E4C766;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gold{background:linear-gradient(180deg,#F6DC86 0%,#E0A92A 45%,#B07A0C 80%,#E9C25A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{width:420px;height:3px;background:linear-gradient(90deg,transparent,#E0A92A,transparent);margin:22px 0 20px}
</style></head><body>
<div class="av"><div class="ring">
  <img src="volidam_emblem.png" style="height:440px;margin-top:10px;filter:drop-shadow(0 12px 26px rgba(0,0,0,.45))">
  <div class="gold" style="font-family:PF;font-weight:900;font-size:120px;letter-spacing:9px;line-height:1;margin-top:18px">VOLIDAM</div>
  <div class="rule"></div>
  <div style="display:flex;align-items:center;gap:18px">
    <img src="safo_emblem_big.png" style="height:96px">
    <div style="font-family:MR;font-weight:800;font-size:44px;letter-spacing:6px;color:#F6F0DE;line-height:1.05">SAFO MARVA<div class="gold" style="font-size:26px;letter-spacing:8px;margin-top:6px">TOUR · ҲАМКОРИ</div></div>
  </div>
</div></div>
</body></html>
