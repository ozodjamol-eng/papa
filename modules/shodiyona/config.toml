# Бот Shodiyona Mebel (@ShodiyonaMebelUzBot). Утверждено владельцем 24.10.2026: делаем ВСЁ сразу.
# Здесь нет секретов: токен — /etc/papa-shodiyona/bot.env (вводит владелец в консоли Франкфурта).
# Пустая строка = пункт не показывается. Тексты для покупателей — узбекская кириллица.

name = "Shodiyona Mebel Markazi"
phone = "+998 70 167 37 77"
instagram = "https://www.instagram.com/shodiyona.mebel.uz/"
telegram_channel = ""          # появится канал — вписать ссылку
hours = ""                     # ответ шефа (г): например "Ҳар куни 09:00–19:00"
delivery = ""                  # ответ шефа (б): например "Андижон бўйлаб етказиб бериш ва йиғиш"

categories = [
  ["bed", "🛏 Ётоқхона"],
  ["living", "🛋 Меҳмонхона"],
  ["kitchen", "🍽 Ошхона"],
  ["kids", "🧸 Болалар"],
  ["soft", "🛋 Юмшоқ мебель"],
  ["wardrobe", "🚪 Шкафлар"],
  ["other", "📦 Бошқа"],
]

# Включённые функции (владелец 24.10: «пускай работают, потом подключим»)
[features]
catalog = true
order = true
cheaper = true
room = true          # 🪄 Хонангизда кўринг: пока ИИ не оплачен — заявка менеджеру с фото комнаты
room_ai = false      # включается, когда шеф оплатит генерацию картинок
measure = true       # 📏 Бепул ўлчов
tracking = true      # 📦 Буюртмам қаерда?

[remind]
