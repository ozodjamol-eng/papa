<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;background:linear-gradient(135deg,#FFFFFF 0%,#FBF8F1 55%,#F3EBDD 100%);font-family:'Inter Display','Inter',sans-serif;overflow:hidden;position:relative}
.left{position:absolute;left:80px;top:54px;width:640px}
.logo{width:190px;display:block;margin-bottom:34px}
.kicker{font-size:22px;letter-spacing:6px;color:#B8814A;font-weight:600;text-transform:uppercase;margin-bottom:18px}
h1{font-size:54px;line-height:1.05;color:#1F3A28;font-weight:700;letter-spacing:-1.5px}
h1 span{color:#B8814A}
.line{width:90px;height:4px;background:#B8814A;margin:24px 0 22px}
.pills{display:flex;gap:12px;flex-wrap:wrap}
.pill{border:2px solid #1F3A28;color:#1F3A28;border-radius:40px;padding:10px 20px;font-size:21px;font-weight:600}
.phone{display:inline-block;margin-top:30px;font-size:34px;font-weight:700;color:#FBF8F1;background:#1F3A28;border-radius:14px;padding:14px 26px;letter-spacing:.5px}
.phone small{display:block;font-size:15px;font-weight:500;color:#D9BE97;letter-spacing:3px;margin-bottom:4px}
.right{position:absolute;right:0;top:0;width:560px;height:720px}
.disc{position:absolute;right:-120px;top:70px;width:620px;height:620px;border-radius:50%;background:#EFE4D2}
.chair{position:absolute;right:56px;top:170px;width:430px;mix-blend-mode:multiply}
.arc{position:absolute;right:48px;top:48px;font-size:15px;letter-spacing:4px;color:#74421E;font-weight:600}
</style></head><body>
<div class="left">
 <img class="logo" src="logo.png">
 <div class="kicker">Ўз ишлаб чиқаришимиз</div>
 <h1>Мебель — ишлаб чиқарувчидан,<br><span>воситачисиз</span></h1>
 <div class="line"></div>
 <div class="pills"><div class="pill">Арзонроқ нарх</div><div class="pill">Буюртма асосида</div><div class="pill">Бепул ўлчов</div></div>
 <div class="phone"><small>БУЮРТМА ВА НАРХ</small>+998 77 923 01 91</div>
</div>
<div class="right"><div class="disc"></div><img class="chair" src="chair.jpg"></div>
<div class="arc">АНДИЖОН · 2-АНДИЖОН ЙЎЛИ</div>
</body></html>
