<script>
const $=id=>document.getElementById(id);
const TM=window.TIMING; const T=TM.starts, VEND=TM.voice_end, W=TM.words||{};
const LINES=TM.lines;
const HEAD=['НОМЕРНИ<br><span class="y">ЎТКАЗДИНГИЗМИ?</span>','КОД ЎЗГАРМАЙДИ.<br><span class="r">ЛЕКИН…</span>','ЭСКИ ОПЕРАТОРГА<br><span class="y">ҚАЙТИШ</span>','ЎТИШДАН ОЛДИН<br><span class="y">3 ТА ИШ</span>','<span class="y">1.</span> ИККИНЧИ<br>ҚУРИЛМА','<span class="y">2.</span> PASSKEY<br><span class="g">КАЛИТ</span>','<span class="y">3.</span> ПАРОЛ ВА<br><span class="r">ЎЧИРМАСЛИК</span>','ЯНГИЛИК —<br><span class="y">БИРИНЧИ БИЗДА</span>','ФОЙДАЛИ<br><span class="y">БЎЛСА…</span>'];
const HSIZE=[104,100,116,104,124,124,116,112,130];
const DUR=VEND+1.3; window.DUR=DUR;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lin=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const spr=x=>x<=0?0:1-Math.exp(-7*x)*Math.cos(11*x), mix=(a,b,k)=>a+(b-a)*k;
const bg=$('bg').getContext('2d'),fx=$('fx').getContext('2d'),arc=$('arc').getContext('2d');
window.ready=document.fonts.ready.then(()=>Promise.all([...document.fonts].map(f=>f.load().catch(()=>0))));
function st(id,op,tf){const e=$(id);e.style.opacity=op;e.style.transform=tf||'';e.style.visibility=op>0.001?'visible':'hidden'}
const w=(k,d)=>W[k]!==undefined?W[k]:d;
function drawBg(t,li){
  bg.fillStyle='#0D1220';bg.fillRect(0,0,1080,1920);
  const ox=(t*14)%90, oy=(t*9)%90;bg.strokeStyle='rgba(255,255,255,.05)';bg.lineWidth=2;
  for(let x=-90;x<=1170;x+=90){bg.beginPath();bg.moveTo(x-ox,0);bg.lineTo(x-ox,1920);bg.stroke()}
  for(let y=-90;y<=2010;y+=90){bg.beginPath();bg.moveTo(0,y-oy);bg.lineTo(1080,y-oy);bg.stroke()}
  const col=(li===1||li===2)?'255,59,71':((li>=4&&li<=6)?'34,197,94':'255,176,0');
  const gr=bg.createRadialGradient(540,950,0,540,950,820);gr.addColorStop(0,`rgba(${col},.20)`);gr.addColorStop(1,`rgba(${col},0)`);bg.fillStyle=gr;bg.fillRect(0,0,1080,1920);
  for(let i=0;i<26;i++){const px=(i*197+t*(8+i%5*4))%1180-50, py=(i*331+t*(5+i%3*3)*-1)%2000; bg.fillStyle=`rgba(255,255,255,${.04+.03*(i%3)})`;bg.beginPath();bg.arc(px,(py+2000)%2000,2+i%3*2,0,7);bg.fill()}
}
// окно сцены i: [T[i]-.3, T[i+1]-.05]
const win=i=>[T[i]-.3,(i+1<T.length?T[i+1]:DUR)];
function show(id,i,from,tf,inDelay=0){ // общий вход/выход по сцене
  const [a,b]=win(i), on=t_>a+inDelay-.1&&t_<b+.1, k=spr(lin(t_,a+inDelay,a+inDelay+.7)), out=i<8?eio(lin(t_,b-.4,b-.05)):0;
  st(id,on?cl(k*2)*(1-out):0,tf(cl(k),out));
}
let t_=0;
window.renderAt=function(t){
  t_=t; fx.clearRect(0,0,1080,1920); arc.clearRect(0,0,1080,1920);
  let li=0;for(let i=0;i<T.length;i++)if(t>=T[i]-.25)li=i;
  drawBg(t,li);
  const lp=lin(t,T[li]-.25,(T[li+1]||DUR)-.25);
  const cs=1.0+.04*(1-eo(lp))+.012*Math.sin(t*.6), cr=Math.sin(t*.43)*.7, cx=Math.sin(t*.37)*10, cy=Math.cos(t*.29)*8;
  const NOC=w('nocode',T[1]+3.0), sh=(t>NOC&&t<NOC+.35)?Math.sin(t*90)*9*(1-lin(t,NOC,NOC+.35)):0;
  $('cam').style.transform=`translate(${cx+sh}px,${cy}px) scale(${cs}) rotate(${cr}deg)`;
  const hk=spr(lin(t,T[li]-.15,T[li]+.45)), hout=li<8?eio(lin(t,T[li+1]-.4,T[li+1]-.1)):0;
  const he=$('h');if(he.dataset.li!=li){he.innerHTML=HEAD[li];he.style.fontSize=HSIZE[li]+'px';he.dataset.li=li}
  st('h',cl(hk*2)*(1-hout),`translateY(${mix(80,0,cl(hk))-hout*60}px)`);
  const si=t>=T[0]-.05?li:-1; $('subt').textContent=si>=0?LINES[si]:'';
  const sa=lin(t,T[li]-.05,T[li]+.15), sb=li<8?1-lin(t,T[li+1]-.4,T[li+1]-.25):1-lin(t,VEND+.3,VEND+.6);
  $('sub').style.opacity=si>=0?cl(sa)*cl(sb):0;

  // 1 — операторы и SIM, дуга A→B
  show('opA',0,0,(k,o)=>`translateX(${mix(-500,0,k)}px)`);
  show('opB',0,0,(k,o)=>`translateX(${mix(500,0,k)}px)`,.15);
  { const [a,b]=win(0); const MV=w('almash',T[1]+1.0);
    const p=eio(lin(t,T[0]+1.2,T[0]+2.6)); // SIM летит от A к B
    const x=mix(-180,250,p), y=-Math.sin(p*Math.PI)*130;
    const k=spr(lin(t,a+.3,a+1.0)), out=eio(lin(t,b-.4,b-.05)), on=t>a&&t<b+.1;
    st('sim',on?cl(k*2)*(1-out):0,`translate(${x}px,${y}px) rotate(${mix(-10,10,p)+Math.sin(t*2)*3}deg) scale(${mix(.6,1,cl(k))})`);
    if(on&&p>0){arc.save();arc.translate(cx,cy);arc.strokeStyle=`rgba(255,176,0,${.6*(1-out)})`;arc.lineWidth=8;arc.setLineDash([22,18]);arc.lineDashOffset=-t*60;
      arc.beginPath();for(let s=0;s<=p;s+=.02){const X=540+mix(-180,250,s), Y=890-Math.sin(s*Math.PI)*130;s?arc.lineTo(X,Y):arc.moveTo(X,Y)}arc.stroke();arc.restore()}
  }
  // 2 — телефон, «код келмади»
  { const a=T[1]-.3, b=T[3]; const k=spr(lin(t,a,a+.7)), out=eio(lin(t,b-.4,b-.05)), on=t>a-.1&&t<b+.1;
    const slide=t>T[2]-.3?eo(lin(t,T[2]-.3,T[2]+.3)):0;
    st('ph',on?cl(k*2)*(1-out):0,`translate(${mix(0,-170,slide)}px,${mix(900,0,cl(k))}px) scale(${mix(1,.86,slide)})`);
    const nk=spr(lin(t,NOC,NOC+.45)); $('nocode').style.opacity=cl(nk*2); $('nocode').style.transform=`scale(${mix(1.6,1,cl(nk))})`;
    $('wait').style.opacity=t<NOC?(.55+.45*Math.sin(t*6)):0;
    if(t>NOC&&t<NOC+.18){fx.fillStyle=`rgba(255,59,71,${.3*(1-lin(t,NOC,NOC+.18))})`;fx.fillRect(0,0,1080,1920)}
  }
  // 3 — B→A и календарь 30 кун
  show('back',2,0,(k,o)=>`translateX(${mix(600,0,k)}px) rotate(${mix(10,3,k)}deg)`,.5);
  { const s0=w('oy',T[2]+3.2); const [a,b]=win(2); const k=spr(lin(t,s0-.2,s0+.45)), out=eio(lin(t,b-.4,b-.05)), on=t>s0-.3&&t<b+.1;
