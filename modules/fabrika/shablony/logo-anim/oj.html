<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:UB;font-weight:900;src:url(f/unbounded-latin-900-normal.woff2)}
@font-face{font-family:UL;font-weight:200;src:url(f/unbounded-latin-200-normal.woff2)}
@font-face{font-family:MS;font-weight:800;src:url(f/montserrat-latin-800-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:MS;font-weight:800;src:url(f/montserrat-cyrillic-800-normal.woff2);unicode-range:U+0400-045F}
@font-face{font-family:MS;font-weight:800;src:url(f/montserrat-cyrillic-ext-800-normal.woff2);unicode-range:U+0460-052F}
@font-face{font-family:MS;font-weight:500;src:url(f/montserrat-latin-500-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#bg{position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 62%,#7a0612 0%,#2a0207 45%,#000 80%)}
#stage{position:absolute;inset:0;perspective:2000px;perspective-origin:50% 45%}
.card{position:absolute;left:50%;top:50%;width:400px;height:711px;margin:-355px 0 0 -200px;border-radius:30px;overflow:hidden;
 box-shadow:0 40px 80px -20px rgba(0,0,0,.8),0 0 0 3px rgba(255,255,255,.08);background:#111;transform-style:preserve-3d;will-change:transform}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card.brand{background:linear-gradient(160deg,#FF1024,#7a0612 70%,#1a0003);display:flex;align-items:center;justify-content:center;flex-direction:column}
.wm{font-size:120px;color:#fff;white-space:nowrap;letter-spacing:2px}
.wm b{font-family:UB;font-weight:900}.wm i{font-family:UL;font-weight:200;font-style:normal;margin-left:.3em}
#title{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
#title .wm span{display:inline-block}
#sub{font:500 30px MS;letter-spacing:8px;color:rgba(255,255,255,.75);margin-top:26px}
#cap{position:absolute;left:0;right:0;bottom:250px;text-align:center;font:800 54px MS;color:#fff}
#cap em{font-style:normal;color:#FF1024}
#tag{position:absolute;left:50%;top:230px;transform:translateX(-50%);font:800 34px MS;color:#fff;background:#FF1024;border-radius:40px;padding:14px 30px;letter-spacing:2px;white-space:nowrap}
#fade{position:absolute;inset:0;background:#000;opacity:0}
</style></head><body>
<div id="bg"></div><div id="stage"></div>
<div id="title"><div class="wm" id="wm"></div><div id="sub">MEDIA • BUSINESS • CREATIVE</div></div>
<div id="tag">ПОРТФОЛИО</div>
<div id="cap">Бизнесингиз учун — <em>@Ozodjamol</em></div>
<div id="fade"></div>
<script>
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),p=(t,a,b)=>cl((t-a)/(b-a));
const eo3=k=>1-Math.pow(1-k,3),eo5=k=>1-Math.pow(1-k,5),eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const back=(k,s=1.7)=>{const c3=s+1;return 1+c3*Math.pow(k-1,3)+s*Math.pow(k-1,2)};
const $=id=>document.getElementById(id);
// wordmark letters
const L=[...'OZOD'].map(c=>[c,'b']).concat([[' ','sp']]).concat([...'JAMOL'].map(c=>[c,'i']));
$('wm').innerHTML='<b>'+[...'OZOD'].map(c=>`<span>${c}</span>`).join('')+'</b><i>'+[...'JAMOL'].map(c=>`<span>${c}</span>`).join('')+'</i>';
const letters=[...document.querySelectorAll('#wm span')];
// cards
const N=7;const cards=[];
const brand=document.createElement('div');brand.className='card brand';brand.innerHTML='<div class="wm" style="font-size:54px"><b>OZOD</b><i>JAMOL</i></div>';$('stage').appendChild(brand);
for(let i=1;i<=N;i++){const d=document.createElement('div');d.className='card';d.innerHTML=`<img src="a/cards/c${i}.jpg">`;$('stage').appendChild(d);cards.push(d)}
function tf(el,{x=0,y=0,z=0,rx=0,ry=0,rz=0,s=1,o=1,blur=0}){el.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;el.style.opacity=o;el.style.filter=blur?`blur(${blur}px)`:'none'}
window.render=function(t){
 // bg pulse
 $('bg').style.opacity=.75+.25*Math.sin(t*1.3);
 // 1) letters from blur (0.2–1.4)
 letters.forEach((s,i)=>{const k=p(t,.2+i*.09,.6+i*.09);s.style.opacity=k;s.style.filter=`blur(${(1-k)*18}px)`;s.style.transform=`translateY(${(1-eo3(k))*40}px)`});
 const sk=p(t,1.2,1.6);$('sub').style.opacity=sk;
 // title shrinks into brand card 2.2–2.8
 const tk=p(t,2.2,2.75);$('title').style.opacity=1-tk;$('title').style.transform=`translateY(-50%) scale(${1-.55*eio(tk)})`;
 const bk=p(t,2.45,2.9);tf(brand,{s:.6+.4*eo5(bk),o:bk*(1-p(t,3.6,3.9)),ry:(1-eo5(bk))*-40,z:0});
 // tag
 const gk=p(t,3.0,3.4),gko=p(t,8.2,8.5);$('tag').style.opacity=gk*(1-gko);$('tag').style.transform=`translateX(-50%) scale(${back(gk,2)})`;
 // 2) deck dealing 3.1–6.6: front card index advances every .5s
 const DS=3.1,DT=.5;
 if(t<6.9){cards.forEach((c,i)=>{const appear=p(t,DS+i*.06-.3,DS+i*.06);const front=Math.min((t-DS)/DT,N-1); // continuous position
   let pos=i-front; // 0 = front, >0 behind, <0 flown away
   if(pos<-1.2){tf(c,{o:0});return}
   if(pos<0){const k=-pos;tf(c,{x:-k*900,y:-k*200,z:200*k,rz:-k*35,ry:-k*40,o:(1-k)*appear});return}
   const z=-pos*160,y=-pos*55,rx=8,ry=-18+pos*3;tf(c,{x:pos*40,y,z,rx,ry,s:1,o:appear*(1-cl((pos-4)/1.5))})})}
 // 3) fan 6.6–8.2
 if(t>=6.6){const fk=eo5(p(t,6.6,7.3)),ck=eio(p(t,8.1,8.7));cards.forEach((c,i)=>{const a=(i-(N-1)/2)*11*fk*(1-ck);
   tf(c,{x:Math.sin(a*Math.PI/180)*900*fk*(1-ck),y:(1-Math.cos(a*Math.PI/180))*900*fk*(1-ck)-40,z:-Math.abs(i-(N-1)/2)*30,rz:a,s:.82+.18*(1-fk)+(-.3*ck),o:1-ck})})}
 // 4) caption + final wordmark
 const ck2=p(t,7.2,7.6),cko=p(t,8.2,8.5);$('cap').style.opacity=ck2*(1-cko);$('cap').style.transform=`translateY(${(1-eo3(ck2))*30}px)`;
 if(t>=8.4){const k=p(t,8.4,8.9);$('title').style.opacity=k;$('title').style.transform=`translateY(-50%) scale(${.8+.2*eo5(k)})`;letters.forEach(s=>{s.style.opacity=1;s.style.filter='none';s.style.transform='none'});$('sub').style.opacity=k}
 $('fade').style.opacity=p(t,9.4,9.9);
 return true};
window.ready=Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>Promise.all(['900 50px UB','200 50px UL','800 50px MS','500 50px MS'].map(f=>document.fonts.load(f,'OZODҚб')))).then(()=>{render(0);return true});
</script></body></html>
