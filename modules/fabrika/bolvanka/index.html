<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style></head>
<body>
<script type="importmap">{"imports":{"three":"/three/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import * as K from './kit.js';
const qs = new URLSearchParams(location.search);
const W = +qs.get('w') || 720, H = +qs.get('h') || 1280;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, W / H, 0.02, 200);
const mod = await import('./scenes/' + qs.get('scene') + '.js');
const ctx = mod.build(THREE, scene, K);
window.DURATION = mod.DURATION;
window.renderFrame = (t) => {
  ctx.update(t);
  const c = mod.camera(t, K);
  camera.position.set(...c.pos); camera.lookAt(...c.look);
  if (c.fov) { camera.fov = c.fov; camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/jpeg', 0.92);
};
window.READY = true;
</script></body></html>
