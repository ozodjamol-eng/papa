# PAPA Voronka — настройки. Секретов здесь нет (токены: /etc/papa-voronka/, /etc/papa-test/).

own_username = "paparazzi.uz"
mode = "all"              # "all" — ответ на любой комментарий; "keyword" — только с кодовыми словами
keywords = ["канал", "kanal"]
spam_words = ["vpn", "впн", "сервис", "заработ", "zarabot", "крипт", "crypto", "invest", "инвест", "казино", "casino", "ставк", "bonus", "бонус", "промокод", "подпис", "obuna", "доход", "pul ishlash", "пул ишлаш"]
dry_run = false           # РАБОТА (включено владельцем 2026-10-15). true — только проверка. true — ничего не отправляет, только показывает. Включать false после проверки.

# Посты под наблюдением: id или ссылка instagram.com/p/... Сначала — один пост.
posts = []
only_users = []          # тест: отвечать только этим аккаунтам (их старые комментарии тоже)
all_recent = true         # последний пост (scan_recent = 1); потом — все свежие. true — все посты за последние max_age_days
scan_recent = 1
max_age_days = 7          # Meta разрешает личный ответ только в течение 7 дней
backlog = false           # false — комментарии, оставленные до включения поста, не трогаем
comments_per_poll = 50
poll_seconds = 120
max_per_hour = 30
pause_minutes = 60
retention_days = 90        # личные данные удаляются через 90 дней (политика конфиденциальности)

page_url = "https://ozodjamol-eng.github.io/papa-site/"   # страница-визитка

