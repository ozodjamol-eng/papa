# GENPLAN PAPA — сетки публикаций. Время — Ташкент (UTC+5). Секретов нет.
# kind: anchor — автоматический пост каждый день (намоз, дуо); content — материал из хаба по рубрике;
#       ad — рекламное окно (непроданное отдаётся контенту, не самопиару); music — «Кун хонандаси».
# days: 1=Пн … 7=Вс; по умолчанию все дни.

mode = "shadow"                  # shadow — всё в тестовые чаты; live — рабочие каналы (только по решению владельца)
signature_default = ""
default_channel = "davra"          # куда бот ставит новый пост по умолчанию (меняется кнопкой «📺 Канал»)
auto_place = false                 # 16.10 владелец: пока панель как в GENPLAN 5 — бот угадывает (✓), вы подтверждаете одним нажатием; «бросил и забыл» — позже
auto_channels = ["davra"]   # 16.10 политика каналов (docs/CHANNELS.md): «какой пульт — такой канал», главный бот молча не перекидывает

# Политика каналов (docs/CHANNELS.md): признаки по началу слов, после перевода латиницы в кириллицу.
# Нарушение — не запрет, а предупреждение в карточке с подсказкой канала («📺 Другой канал»).
[policy.groups]
politics = ["сиёсат", "сиёсий", "президент", "парламент", "депутат", "сенатор", "сайлов", "олий мажлис", "партия", "мирзиёев",
            "путин", "трамп", "зеленск", "уруш", "санкция", "политик", "выбор", "война", "қуролли", "ҳарбий амалиёт"]
crime = ["жиноят", "қотил", "ўлдир", "ўғирла", "қамоқ", "ҳибсга", "зўрла", "пичоқла", "убий", "преступ", "арестован", "мурда"]
showbiz = ["клип", "премьера", "хонанда", "қўшиқчи", "концерт", "актёр", "актриса", "шоу-бизнес", "шоу бизнес", "юлдузлар"]
[policy.labels]
politics = "политика"
crime = "криминал"
showbiz = "шоу-бизнес / клипы"

# Хук по смыслу текста: первая совпавшая тема (по началу слов, после перевода латиницы в кириллицу).
# silent = true — печальные темы: никакого хука, только юзернейм. Канал может отключить темы: topics = false.
[[topics]]
name = "Печаль"
silent = true
words = ["вафот", "фожиа", "марҳум", "ҳалок", "жаноза", "таъзия", "оламдан ўт", "қазо қил", "ҳалокатда"]

# Пост дня (решение 17.10): «Бугун — … куни» — всегда #БУГУН (не новости, не погода); «Хайрли тонг»/«Жума муборак» — #ХАЙРЛИ_ТОНГ
[[topics]]
name = "Бугун"
tag = "#БУГУН"
pattern = '^\W*бугун\b[^\n]{0,80}\bкуни\b'
hooks = ["❤️ Яқинларингизга ҳам юборинг — кунлари хайрли бўлсин!", "🤲 Ёқса — дўстларингизга улашинг!"]

[[topics]]
name = "Тонг"
tag = "#ХАЙРЛИ_ТОНГ"
pattern = 'хайрли тонг|жума муборак|тонги муборак'

# Дуо — отдельный смысл (17.10: дуо получило #ҚИЗИҚАРЛИ — неправильно)
[[topics]]
name = "Дуо"
tag = "#ДУО"
pattern = '(?<![\w])(дуо|аллоҳим|илоҳим|ё раббим|ё роббим|омийн|омин)(?![\w])'
hooks = ["🤲 Омийн деб, яқинларингизга ҳам юборинг!", "🤲 Дуоларимиз ижобат бўлсин — улашинг!"]

