# Бот VOLIDAM × Safo Marva (клиент Нодирбек Ҳайитов). Утверждено владельцем 02.11.2026.
# Секретов нет: токен — /etc/papa-volidam/bot.env (вводит владелец в консоли Франкфурта).
# Пакеты, даты и цены — ОДИН источник: data.json страницы (site), запасная копия — data.json рядом.
site = "https://ozodjamol-eng.github.io/papa-site/volidam/"
youtube = "https://www.youtube.com/@volidamuz"
instagram = ""
channel = "https://t.me/safo_marva_nodirbek"
manager = "Nodirbek_umra"
channel_id = "@safo_marva_nodirbek"   # 02.11: бот — админ канала; публикация только по «✅» владельца   # 02.11: шеф Умры — кнопка «✍️ Нодирбекка ёзиш»
welcome_photo = "https://ozodjamol-eng.github.io/papa-site/volidam/img/og.jpg"

[remind]
minutes = 15
day_start = 8
day_end = 21

# 04.11: ФИЛИАЛЫ. Новый филиал = ещё один блок [[branch]].
#   id      — латиница, в ссылках: ?start=br_<id> (клиент), ?start=mgr_<MANAGER_CODE>_<id> (менеджер филиала)
#   group   — юзернейм Telegram-группы филиала (или /bind <id> владельцем прямо в группе)
#   starts  — старые метки ссылок, которые тоже ведут в этот филиал (панель papa-site/filial)
[[branch]]
id = "xojaobod"
name = "Хўжаобод филиали"
head = "Шаҳзодбек"
manager = "umra_xojaobod"
write = "✍️ Шаҳзодбекка ёзиш"
phone_label = "Хўжаобод"
group = "volidam_xojaobod"
starts = ["filial", "insta_filial"]
