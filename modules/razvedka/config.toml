# PAPA Razvedka — что читать. Секретов здесь нет.
# 30.10: ВАЖНО — простые настройки должны стоять ВЫШЕ блоков [[folders]]. Раньше они стояли ниже и TOML
# относил их к первой папке: свои каналы не собирались, dossier_watch и др. не читались.

# 23.10 владелец: главные источники готовых утренних видео («… тонги муборак» каждый день) — охота листает их глубже
morning_priority = ["тезкор хабарлар", "tezkor yangiliklar"]

# Свои каналы — для сравнения с лидерами
own_channels = ["xojaobodcity24", "ozodjamoll", "kattadavrauz"]

first_days = 7        # глубина первого сбора нового канала
refresh_days = 3      # сколько дней назад обновлять просмотры при повторном сборе
pause_seconds = 3     # пауза между каналами (бережное чтение)
report_days = 7       # период отчёта
report_format = "cards"  # 18.10 владелец: отчёт картинками «как в Excel»; "text" — прежний текст (откат)
dossier_days = 14     # досье больших каналов: период (17.10)
dossier_watch = ["водий бозор", "vodiybozor", "andijon bugun", "андижон бугун"]  # 18.10: главные соперники — всегда в досье
dossier_big = 6        # сколько больших каналов разбирать

# Папки Telegram. Каждая папка = тема.
#   slug — ссылка-папка t.me/addlist/<slug>;
#   name — папка владельца в его Telegram по названию (регистр и пробелы не важны).
[[folders]]
slug = "YBPSRBlZyvI2NWJi"
topic = "XOJAOBODCITY (38)"

# 30.10 владелец: «сначала изучить конкурентов» — конкуренты КАТТА ДАВРА для режима дня
