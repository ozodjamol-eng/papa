# NEXUS V2 hardening + limits (drop-in). Rollback: delete this file, daemon-reload, restart.
[Unit]
StartLimitIntervalSec=0
[Service]
WorkingDirectory=/opt/nexus-private-control-v2/current
ExecStart=
ExecStart=/opt/nexus-private-control-v2/.venv/bin/uvicorn nexus_control.run:app --host 127.0.0.1 --port 8788 --workers 1 --no-access-log --proxy-headers --forwarded-allow-ips=127.0.0.1
Restart=always
RestartSec=5
MemoryHigh=192M
MemoryMax=256M
MemorySwapMax=0
CPUQuota=50%
TasksMax=64
LimitNOFILE=1024
LogRateLimitIntervalSec=30s
LogRateLimitBurst=300
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
PrivateDevices=true
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
CapabilityBoundingSet=
AmbientCapabilities=
SystemCallArchitectures=native
