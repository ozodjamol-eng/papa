# 🌙 Ролики «Кечки дайжест» в стиле iPhone — Хўжаобод (27.10) и КАТТА ДАВРА (28.10). Франкфурт в 19:50 кладёт данные
# в ветку digest-data (deploy-key) → здесь рендер → MP4 в ветку motion → GENPLAN публикует в 20:30. Нет ролика — картинка/текст.
name: motion-digest
on:
  push:
    branches: [digest-data]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: motion-branch, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-24.04   # 27.10: ubuntu-latest стала 26.04 — Playwright 1.56 там не ставится
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Данные Франкфурта
        run: |
          git fetch -q --depth 1 origin digest-data
          mkdir -p "$RUNNER_TEMP/data" && git archive FETCH_HEAD data | tar -x -C "$RUNNER_TEMP"
          ls -la "$RUNNER_TEMP/data"
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: pw-1.56-chromium-ubuntu24 }
      - name: Зависимости
        working-directory: modules/fabrika/motion/weather
        run: |
          npm install --no-audit --no-fund
          # 27.10: apt на раннере GitHub завис на 20 мин → вечерний ролик не успел. Повторы + предел времени на каждую попытку.
          for i in 1 2 3; do timeout 420 npx playwright install --with-deps chromium && break; echo "повтор playwright $i"; sleep 10; done
          for i in 1 2 3; do sudo timeout 300 apt-get install -y -q -o Acquire::Retries=3 ffmpeg fonts-noto-color-emoji >/dev/null && break; echo "повтор apt $i"; sleep 10; done
          python3 -m pip install -q numpy
      - name: Рендер
        working-directory: modules/fabrika/motion/dayjest
        run: |
          ln -sfn ../weather/node_modules node_modules
          sudo apt-get install -y -q fonts-noto-color-emoji >/dev/null || true
          # 27.10 владелец утвердил iPhone-дайджест (dayjest) для Хўжаобода; 28.10 — и для КАТТА ДАВРА.
          # Старый ролик с новостями больше не собирается ни как основной, ни как запасной (решение 28.10):
          # не собрался ролик — GENPLAN в 20:30 выпускает картинку-дайджест.
          mkdir -p "$RUNNER_TEMP/out"
          for js in "$RUNNER_TEMP"/data/*.json; do
            [ -f "$js" ] || continue
            if ! python3 make.py kech "$RUNNER_TEMP/out" "$js"; then
              echo "::warning::$(basename "$js"): ролик не собрался — в 20:30 выйдет картинка"
            fi
          done
      - name: В ветку motion (по 3 последних дня на канал)
        run: |
          set -e
          W="$RUNNER_TEMP/motion"; mkdir -p "$W"; cd "$W"; git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin motion && git checkout -q FETCH_HEAD -- . 2>/dev/null || true
          cp "$RUNNER_TEMP"/out/*-digest-*.mp4 . 2>/dev/null || echo "роликов нет — выйдут картинки"
          for pre in xojaobod-digest davra-digest xojaobod-weather; do
            ls $pre-*.mp4 2>/dev/null | sort | head -n -3 | while read f; do rm -f "$f" "${f%.mp4}.json"; done
          done
          git checkout -q --orphan motion; git add -A
          git -c user.name=papa-motion -c user.email=papa-motion@users.noreply.github.com commit -q -m "motion: дайджесты"
          git push -q -f origin motion
          ls -la
