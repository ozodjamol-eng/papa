# ☀️ Ролик «Об-ҳаво Хўжаобод» каждый день (решение владельца 20.10). Рендер на GitHub (7 ГБ ОЗУ, бесплатно),
# не на Франкфурте (1 ГБ — браузер не помещается). Готовый MP4 → ветка motion; служба GENPLAN забирает его к 07:00.
# Не вышло — GENPLAN публикует прежний текст (пост не пропадает).
name: motion-weather
on:
  schedule:
    - cron: "15 0 * * *"      # 05:15 Ташкент; запас на задержки расписания GitHub
    - cron: "5 1 * * *"       # 06:05 — повтор, если первый запуск опоздал/упал (готовый файл не пересобирается)
  workflow_dispatch:
  push:
    branches: [motion-test, weather-req]   # weather-req — заказ с Франкфурта 05:00 (21.10: расписание GitHub не сработало)
permissions:
  contents: write
concurrency: { group: motion-branch, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-24.04   # 27.10: ubuntu-latest стала 26.04 — Playwright 1.56 там не ставится
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Уже собран сегодня?
        id: chk
        run: |
          D=$(TZ=Asia/Tashkent date +%F)
          echo "day=$D" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code origin refs/heads/motion >/dev/null && \
             git fetch -q --depth 1 origin motion && git cat-file -e FETCH_HEAD:xojaobod-weather-$D.mp4 2>/dev/null \
             && [ "${{ github.ref_name }}" != "motion-test" ] && [ "${{ github.ref_name }}" != "weather-req" ]; then echo "done=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.done != '1'
        with: { node-version: "20" }
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: pw-1.56-chromium-ubuntu24 }
      - name: Зависимости
        if: steps.chk.outputs.done != '1'
        working-directory: modules/fabrika/motion/weather
        run: |
          npm install --no-audit --no-fund
          # 27.10: apt на раннере GitHub завис на 20 мин → вечерний ролик не успел. Повторы + предел времени на каждую попытку.
          for i in 1 2 3; do timeout 420 npx playwright install --with-deps chromium && break; echo "повтор playwright $i"; sleep 10; done
          for i in 1 2 3; do sudo timeout 300 apt-get install -y -q -o Acquire::Retries=3 ffmpeg fonts-noto-color-emoji >/dev/null && break; echo "повтор apt $i"; sleep 10; done
          python3 -m pip install -q numpy
      - name: Рендер
        if: steps.chk.outputs.done != '1'
        working-directory: modules/fabrika/motion/weather
        run: |
          ln -sfn ../weather/node_modules ../dayjest/node_modules
          sudo apt-get install -y -q fonts-noto-color-emoji >/dev/null || true
          # 27.10 владелец утвердил: в 07:00 — «Эрталабки дайжест» в стиле iPhone (dayjest). Сломался — прежний «Об-ҳаво».
          python3 ../dayjest/make.py tong "$RUNNER_TEMP/out" "$GITHUB_WORKSPACE/data/weather-request.json" || { echo "::warning::dayjest tong не собрался — прежний ролик"; python3 make.py "$RUNNER_TEMP/out"; }
      - name: В ветку motion (только последние 3 дня)
        if: steps.chk.outputs.done != '1'
        run: |
          set -e
          W="$RUNNER_TEMP/motion"; mkdir -p "$W"; cd "$W"; git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin motion && git checkout -q FETCH_HEAD -- . 2>/dev/null || true
          cp "$RUNNER_TEMP"/out/xojaobod-weather-* .
          ls xojaobod-weather-*.mp4 | sort | head -n -3 | while read f; do rm -f "$f" "${f%.mp4}.json"; done
          git checkout -q --orphan motion; git add -A
          git -c user.name=papa-motion -c user.email=papa-motion@users.noreply.github.com commit -q -m "motion: ${{ steps.chk.outputs.day }}"
          git push -q -f origin motion
          ls -la
